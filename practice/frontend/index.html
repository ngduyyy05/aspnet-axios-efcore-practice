<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý sản phẩm - Axios demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input { padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer; background: #2563eb; color: #fff; }
    button.secondary { background: #6b7280; }
    button.danger { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    #msg { margin: 8px 0; color: #b91c1c; min-height: 20px; }
  </style>
</head>
<body>
  <h1>Quản lý sản phẩm (Axios → ASP.NET Core API)</h1>

  <form id="product-form">
    <input type="hidden" id="id" />
    <input id="name" placeholder="Tên sản phẩm" required />
    <input id="price" type="number" step="0.01" min="0" placeholder="Giá" required />
    <input id="quantity" type="number" min="0" placeholder="Số lượng" required />
    <button type="submit" id="submit-btn">Thêm</button>
    <button type="button" id="cancel-btn" class="secondary" hidden>Hủy sửa</button>
  </form>

  <div id="msg"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>Tên</th><th>Giá</th><th>Số lượng</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
